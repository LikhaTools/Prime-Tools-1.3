<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UNIQUE SHIPPING COST & COD</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

body{
    display:flex;
    flex-direction:column;
    align-items:center;
    font-family:Arial,sans-serif;
}

table{
    width:80%;
    border-collapse:collapse;
    text-align:center;
    margin-top:20px;
}

th,td{
    border:1px solid #000;
    padding:8px;
}

th{
    background:#f2f2f2;
}

button,
#fileInput{
    margin:10px;
}

.greenCell{
    background:green;
    color:#fff;
    font-weight:bold;
}

.redCell{
    background:red;
    color:#fff;
    font-weight:bold;
}

</style>

</head>

<body>

<h1>UNIQUE SHIPPING COST & COD</h1>

<div>

<input
    type="file"
    id="fileInput"
    accept=".xlsx,.xls,.csv"
>

<button onclick="processFile()">
    Process File
</button>

<button onclick="uploadDataToSheet()">
    Upload Data
</button>

<span
    id="uploadStatus"
    style="
        margin-left:10px;
        font-weight:bold;
    "
></span>

</div>

<h2>Unique Shipping Cost</h2>

<table id="outputTableShipping">

<thead>
<tr>
<th>DATE</th>
<th>UNIQUE SHIPPING COST</th>
</tr>
</thead>

<tbody></tbody>

</table>

<h2>Unique COD Amounts Per Sender</h2>

<table id="outputTableCOD">

<thead>
<tr>
<th>SENDER NAME</th>
<th>UNIQUE COD AMOUNTS</th>
</tr>
</thead>

<tbody></tbody>

</table>

<script>

function processFile(){

    const file =
        document.getElementById('fileInput')
        .files[0];

    if(!file){

        alert("Please select file.");
        return;

    }

    const reader =
        new FileReader();

    reader.onload = function(e){

        const data =
            new Uint8Array(
                e.target.result
            );

        const workbook =
            XLSX.read(data,{
                type:'array'
            });

        const sheet =
            workbook.Sheets[
                workbook.SheetNames[0]
            ];

        const jsonData =
            XLSX.utils.sheet_to_json(
                sheet,
                {header:1}
            );

        processSheet(jsonData);

    };

    reader.readAsArrayBuffer(file);
}

function processSheet(data){

    const headers =
        data[0].map(h =>
            h
            ? h.toLowerCase().trim()
            : ''
        );

    const submissionTimeIndex =
        headers.findIndex(
            h => h.includes("submission time")
        );

    const shippingCostIndex =
        headers.findIndex(
            h => h.includes("total shipping cost")
        );

    const senderNameIndex =
        headers.findIndex(
            h => h.includes("sender name")
        );

    const codIndex =
        headers.findIndex(
            h => h === "cod"
        );

    const submissionDates =
        data.slice(1)
        .map(row => row[submissionTimeIndex])
        .filter(date =>
            date &&
            !isNaN(Date.parse(date))
        );

    const shippingCosts =
        data.slice(1)
        .map(row =>
            parseFloat(
                row[shippingCostIndex]
            )
        )
        .filter(cost =>
            !isNaN(cost)
        );

    const uniqueShippingCosts =
        [...new Set(shippingCosts)]
        .sort((a,b)=>a-b);

    const dateRange =
        getDateRange(submissionDates);

    const shippingCellClass =
        uniqueShippingCosts.some(
            cost => cost > 37
        )
        ? 'redCell'
        : 'greenCell';

    document.querySelector(
        '#outputTableShipping tbody'
    ).innerHTML = `
        <tr>
            <td>${dateRange}</td>

            <td class="${shippingCellClass}">
                ${uniqueShippingCosts.join(', ')}
            </td>
        </tr>
    `;

    const senderCODMap =
        new Map();

    data.slice(1).forEach(row => {

        const sender =
            row[senderNameIndex]?.trim();

        const codAmount =
            parseFloat(row[codIndex]);

        if(sender && !isNaN(codAmount)){

            if(!senderCODMap.has(sender)){

                senderCODMap.set(
                    sender,
                    new Set()
                );

            }

            senderCODMap
            .get(sender)
            .add(codAmount);

        }

    });

    const tbody =
        document.querySelector(
            '#outputTableCOD tbody'
        );

    tbody.innerHTML = '';

    senderCODMap.forEach(
        (codSet,sender)=>{

        const uniqueCODs =
            [...codSet]
            .sort((a,b)=>a-b)
            .join(', ');

        tbody.innerHTML += `
            <tr>
                <td>${sender}</td>
                <td>${uniqueCODs}</td>
            </tr>
        `;

    });

}

function getDateRange(dates){

    const parsed =
        dates
        .map(d => new Date(d))
        .filter(d => !isNaN(d));

    if(parsed.length===0){

        return 'N/A';

    }

    return `
        ${parsed[0]
            .toISOString()
            .split('T')[0]}
        to
        ${parsed[
            parsed.length-1
        ]
            .toISOString()
            .split('T')[0]}
    `;
}

async function uploadDataToSheet(){

    const file =
        document.getElementById('fileInput')
        .files[0];

    if(!file){

        alert("Please select file.");
        return;

    }

    const uploadStatus =
        document.getElementById(
            'uploadStatus'
        );

    uploadStatus.style.color =
        'green';

    uploadStatus.innerText =
        'Preparing...';

    const reader =
        new FileReader();

    reader.onload =
    async function(e){

        const data =
            new Uint8Array(
                e.target.result
            );

        const workbook =
            XLSX.read(data,{
                type:'array'
            });

        const sheet =
            workbook.Sheets[
                workbook.SheetNames[0]
            ];

        const jsonData =
            XLSX.utils.sheet_to_json(
                sheet,
                {header:1}
            );

        const headers =
            jsonData[0].map(h =>
                h
                ? h.toLowerCase().trim()
                : ''
            );

        const senderNameIndex =
            headers.findIndex(
                h => h.includes("sender name")
            );

        const itemNameIndex =
            headers.findIndex(
                h => h.includes("item")
            );

        const waybillIndex =
            headers.findIndex(
                h => h.includes("waybill")
            );

        const submissionTimeIndex =
            headers.findIndex(
                h => h.includes("submission time")
            );

        const uploadData = [];

        for(
            const row of jsonData.slice(1)
        ){

            uploadData.push({

                sender_name:
                    row[senderNameIndex] || "",

                item_name:
                    row[itemNameIndex] || "",

                waybill:
                    row[waybillIndex] || "",

                submission_time:
                    row[submissionTimeIndex] || ""

            });

        }

        uploadStatus.innerText =
            `Uploading ${uploadData.length} rows...`;

        try{

            const response =
                await fetch(
                "https://script.google.com/macros/s/AKfycbx0hihRBW3ISWzQh8ANZNPvWVFN9_R3pddtavO_tmFkiSECtbiv7pyMpOABzWgV4pPW/exec",
                {
                    method:'POST',

                    headers:{
                        "Content-Type":
                        "text/plain;charset=utf-8"
                    },

                    body:JSON.stringify(
                        uploadData
                    )
                });

            const result =
                await response.json();

            if(result.success){

                uploadStatus.style.color =
                    'green';

                uploadStatus.innerText =
                    `${result.uploaded} Uploaded Successfully`;

                alert(
                    "Upload successful!"
                );

            }else{

                uploadStatus.style.color =
                    'red';

                uploadStatus.innerText =
                    'UPLOAD FAILED';

                alert(
                    result.error
                );

            }

        }catch(err){

            console.error(err);

            uploadStatus.style.color =
                'red';

            uploadStatus.innerText =
                'UPLOAD FAILED';

            alert(
                "Error uploading data."
            );

        }

    };

    reader.readAsArrayBuffer(file);

}

</script>

</body>
</html>

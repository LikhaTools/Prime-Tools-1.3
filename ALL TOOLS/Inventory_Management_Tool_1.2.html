<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inventory Mega (Pro) - Final Logic</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

body{ font-family:'Inter',sans-serif; margin:0; background:#f5f5f5; color:#111; overflow:hidden; }
.container{ display:flex; height:100vh; position:relative; margin-left:25px; }
.topTitle{ position:fixed; top:12px; left:45px; font-size:18px; font-weight:700; color:#4f46e5; z-index:1000; letter-spacing:0.5px; }
.left{ width:27%; background:#fff; padding:60px 12px 16px 12px; display:flex; flex-direction:column; gap:8px; font-size:13px; overflow-y:auto; box-sizing:border-box; }
.left h3{ margin:0 0 10px 0; font-size:16px; }
.inputLabel{ font-weight:600; margin:6px 0 2px 0; font-size:11px; color:#4f46e5; text-transform: uppercase; }
textarea{ width:100%; padding:8px; border-radius:6px; border:1px solid #ddd; background:#fafafa; color:#111; resize:none; font-size:12px; box-sizing:border-box; height:70px; margin-bottom:4px; }
.leftButtons{ margin-top:10px; display:flex; flex-direction:column; gap:8px; }
.left button{ width:100%; padding:10px; border-radius:8px; background:#fff; color:#111; font-weight:600; cursor:pointer; border:1px solid #000; transition: all 0.2s ease; }
.left button:hover{ background:#000; color:#fff; transform:translateY(-2px); }
.right{ flex:1; position:relative; overflow:auto; padding:20px; font-size:13px; }
.empty{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; color:#888; font-weight:600; }
@keyframes fadeInOut{ 0%,100%{opacity:0.3;} 50%{opacity:1;} }

table{ width:100%; border-collapse:collapse; margin-bottom:25px; background:#fff; border-radius:10px; overflow:hidden; table-layout:fixed; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
th,td{ border:1px solid #ccc; padding:10px 8px; text-align:center; }

/* ✅ DARK HEADER */
th{
background:#111 !important;
color:#fff !important;
font-weight:700;
border:1px solid #111;
}

td.numVal{ font-weight:700; font-size:14px; }
th:nth-child(1), td:nth-child(1){ width:28%; text-align:left; padding-left:15px; }
th:not(:nth-child(1)), td:not(:nth-child(1)) { width:12%; }

/* TABLE COLORS (FULL CELL) */
.bg-lime { background-color: #00ff00 !important; color:#000 !important; }
.bg-cyan { background-color: #00ffff !important; color:#000 !important; }
.bg-yellow { background-color: #ffff00 !important; color:#000 !important; }
.bg-orange { background-color: #ff9900 !important; color:#000 !important; }
.bg-red { background-color: #ff0000 !important; color:#fff !important; }

/* FEED CARD COLORS */
.itemBox.bg-lime { background:#00ff00 !important; color:#000 !important; }
.itemBox.bg-cyan { background:#00ffff !important; color:#000 !important; }
.itemBox.bg-yellow { background:#ffff00 !important; color:#000 !important; }
.itemBox.bg-orange { background:#ff9900 !important; color:#000 !important; }
.itemBox.bg-red { background:#ff0000 !important; color:#fff !important; }

.classHeader{ background:#4f46e5; color:#fff; font-weight:600; padding:10px 15px; font-size:14px; border-radius:8px 8px 0 0; }
.feed{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:15px; margin-top:20px; }
.itemBox{ padding:15px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.08); display:flex; flex-direction:column; transition: 0.3s; border: 1px solid #ddd; }
.itemBox:hover{ transform:scale(1.02); }
.title{font-size:14px; font-weight:700; margin-bottom:5px;}
.sub{font-size:11px; opacity: 0.8;}
.valGrid{ display:grid; grid-template-columns: repeat(6, 1fr); margin-top:10px; text-align:center;}
.bigNum{ font-size:18px; font-weight:800; }
#searchBox { width: 100%; padding: 8px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ddd; } </style>

</head>
<body>

<div class="topTitle">Inventory Mega (Pro)</div>

<div class="container">
<div class="left">
<h3>📥 INPUT DATA</h3>

<div class="inputLabel">Hold / Within 10d</div>
<textarea id="hold"></textarea>

<div class="inputLabel">Shipped Stock</div>
<textarea id="shipped"></textarea>

<div class="inputLabel">RTS (Return to Sender)</div>
<textarea id="rts"></textarea>

<div class="inputLabel">Supplier In</div>
<textarea id="supplier"></textarea>

<div class="leftButtons">
<button onclick="runAll()" id="btnCompute">🚀 Compute</button>
<button onclick="copyTableAsImage()">📋 Copy as Image</button>
<button onclick="uploadFull()">📤 Full Upload to GSheet</button>
</div>
</div>

<div class="right">
<input type="text" id="searchBox" placeholder="Search item name..." oninput="render()">
<div id="empty" class="empty"><span>📊 Waiting for data...</span></div>
<div id="output"></div>
<div id="feed" class="feed"></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxRfV4yAlBkk5x90fNpml_g5vF80kShQSN2uqvz9761wobdLv-w3EeoZAh57THt3POA8A/exec";

let classMap = {}, itemMapping = {}, finalData = [];

function pcs(name){ const m=name.match(/^(\d+)\s*x/i); return m?Number(m[1]):1; }
function clean(name){ return name.replace(/^\d+\s*x\s*/i,'').trim().toUpperCase(); }
function num(v){ return Number(String(v||0).replace(/,/g,'')) || 0; }
function round100(n){ return n<=0 ? 0 : Math.ceil(n/100)*100; }
function mapItemName(rawName) { const cleaned = clean(rawName); return itemMapping[cleaned] || cleaned; }

async function runAll() {
const btn = document.getElementById('btnCompute');
const empty = document.getElementById('empty');
btn.disabled = true;
empty.innerHTML = `<span style="animation:fadeInOut 1s infinite">🔄 Fetching Class & Mapping...</span>`;
try {
const response = await fetch(WEBAPP_URL);
const data = await response.json();
classMap = {};
data.classMap.forEach(r => { classMap[r.name.toUpperCase()] = { class: r.class, stock: num(r.stock) }; });
itemMapping = data.itemMapping || {};
compute();
} catch (e) { alert("Fetch Error: " + e.message); } finally { btn.disabled = false; }
}

function parseInput(id) {
const text = document.getElementById(id).value.trim();
const map = {}; if(!text) return map;
text.split('\n').forEach(line => {
if (!line.trim()) return;
let name = "", v1 = 0, v2 = 0, raw1 = 0, raw2 = 0;
if (id === 'supplier') {
const p = line.split('-'); if(p.length < 2) return;
const rawName = p.slice(0,-1).join('-').trim();
const mult = pcs(rawName);
raw1 = num(p[p.length-1]);
v1 = raw1 * mult;
name = mapItemName(rawName);
} else {
const cols = line.split('\t'); if(cols.length < 2 || /Item|Total/i.test(cols[0])) return;
const rawName = cols[0], mult = pcs(rawName);
raw1 = num(cols[1]); raw2 = num(cols[2] || 0);
v1 = raw1 * mult; v2 = raw2 * mult;
name = mapItemName(rawName);
}
if(!map[name]) map[name] = { val1:0, val2:0, raw1:0, raw2:0 };
map[name].val1 += v1; map[name].val2 += v2;
map[name].raw1 += raw1; map[name].raw2 += raw2;
});
return map;
}

function compute() {
const hMap = parseInput('hold'), sMap = parseInput('shipped'), rMap = parseInput('rts'), supMap = parseInput('supplier');
const allNames = new Set([...Object.keys(classMap), ...Object.keys(hMap), ...Object.keys(supMap)]);
finalData = [];
allNames.forEach(name => {
const info = classMap[name] || { class: 'F', stock: 0 };
const holdPcs = hMap[name]?.val1 || 0, within10Pcs = hMap[name]?.val2 || 0;
const rawHold = hMap[name]?.raw1 || 0, rawWithin10 = hMap[name]?.raw2 || 0;

const totalStock = Math.max(info.stock + (supMap[name]?.val1||0) + (rMap[name]?.val1||0) - (sMap[name]?.val1||0), 0);
const newStock = Math.max(totalStock - holdPcs, 0);

const avgReleasePcs = within10Pcs / 10;
const rawAvgOrder = rawWithin10 / 10;

let days = avgReleasePcs > 0 ? Math.floor(newStock / avgReleasePcs) : (newStock > 0 ? 99 : 0);

let restock = 0;
const target = { A:10, B:5, C:3, D:2, F:1, E:0 }[info.class] || 0;
if(info.class !== 'E') restock = Math.max(0, (avgReleasePcs * target) + holdPcs - totalStock);
if(['A','B','C'].includes(info.class)) restock = round100(restock);

finalData.push({ item: name, cls: info.class, stock: totalStock, hold: rawHold, avg: rawAvgOrder, avgRelease: avgReleasePcs, days, restock });
});
render();
}

function render() {
const search = document.getElementById('searchBox').value.toUpperCase();
const filtered = finalData.filter(r => r.item.includes(search) && (r.stock > 0 || r.hold > 0 || r.avg > 0 || r.restock > 0));
const output = document.getElementById('output'), feed = document.getElementById('feed'), empty = document.getElementById('empty');
if (filtered.length === 0) { empty.style.display = "block"; output.innerHTML = ""; feed.innerHTML = ""; return; }
empty.style.display = "none";

const groups = { A:[], B:[], C:[], D:[], E:[], F:[] };
filtered.forEach(r => groups[r.cls]?.push(r));

let html = "", fhtml = "";
const titles = { A:"Class A (10 Days)", B:"Class B (5 Days)", C:"Class C (3 Days)", D:"Class D (New Item)", E:"Class E (Clearance)", F:"Class F (For Hold)" };

Object.keys(groups).forEach(k => {
if (!groups[k].length) return;
groups[k].sort((a,b) => a.days - b.days || b.restock - a.restock);

html += `<div class="classHeader">${titles[k]}</div>
<table>
<tr><th>Item</th><th>Stock</th><th>Hold</th><th>Remaining Days</th><th>Avg Order</th><th>Avg Release</th><th>Restock</th></tr>`;

groups[k].forEach(r => {
let color = "bg-red";
if(r.days >= 20) color="bg-lime";
else if(r.days >= 15) color="bg-cyan";
else if(r.days >= 10) color="bg-yellow";
else if(r.days >= 5) color="bg-orange";

html += `<tr>
<td>${r.item}</td>
<td class="numVal" data-val="${r.stock}">0</td>
<td class="numVal" data-val="${Math.round(r.hold)}">0</td>
<td class="numVal ${color}" data-val="${r.days}">0</td>
<td class="numVal" data-val="${Math.round(r.avg)}">0</td>
<td class="numVal" data-val="${Math.round(r.avgRelease)}">0</td>
<td class="numVal" data-val="${Math.round(r.restock)}">0</td>
</tr>`;

fhtml += `<div class="itemBox ${color}">
<div class="sub">CLASS ${r.cls}</div>
<div class="title">${r.item}</div>
<div class="valGrid">
<div><div class="bigNum">${r.stock}</div><div class="sub">Stock</div></div>
<div><div class="bigNum">${r.days}</div><div class="sub">Days</div></div>
<div><div class="bigNum">${Math.round(r.restock)}</div><div class="sub">Restock</div></div>
<div><div class="bigNum">${Math.round(r.hold)}</div><div class="sub">Hold</div></div>
<div><div class="bigNum">${Math.round(r.avg)}</div><div class="sub">Avg Order</div></div>
<div><div class="bigNum">${Math.round(r.avgRelease)}</div><div class="sub">Avg Release</div></div>
</div></div>`;
});

html += `</table>`;
});

output.innerHTML = html;
feed.innerHTML = fhtml;
animateNumbers();
}

function animateNumbers() {
document.querySelectorAll('.numVal').forEach(el => {
let endVal = Number(el.getAttribute('data-val')) || 0;
if (endVal === 0) { el.textContent = "0"; return; }
let start = 0;
const step = () => {
start += Math.ceil(endVal / 20);
if (start >= endVal) start = endVal;
el.textContent = start;
if (start < endVal) requestAnimationFrame(step);
};
requestAnimationFrame(step);
});
}

function copyTableAsImage() {
html2canvas(document.getElementById('output')).then(canvas => {
canvas.toBlob(blob => {
navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]).then(() => alert("Copied!"));
});
});
}

function uploadFull() {
if (finalData.length === 0) return alert("No data to upload!");
const btn = document.querySelector('button[onclick="uploadFull()"]');
btn.innerText = "⏳ Uploading...";
btn.disabled = true;

const payload = {
FULL_UPLOAD: finalData.map(r => ({
item: (r.item||"").toString().trim().toUpperCase(),
class: r.cls,
stock: Number(r.stock||0),
hold: Number(r.hold||0),
avg: Number(r.avg||0),
restock: Number(r.restock||0),
remaining: Number(r.days||0),
avgRelease: Number(r.avgRelease||0)
})),
HOLD_UPLOAD: document.getElementById('hold').value
.split('\n')
.map(line => {
const parts = line.split('\t');
if(parts.length < 2) return null;
return { item: (parts[0]||"").toString().trim().toUpperCase(), qty: Number(parts[1]||0) };
})
.filter(r => r && r.item && r.qty > 0)
};

fetch(WEBAPP_URL, {
method:"POST",
mode:"no-cors",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(payload)
}).then(() => {
alert("✅ Upload Successful!");
btn.innerText = "📤 Full Upload to GSheet";
btn.disabled = false;
}).catch(err=>{
alert("Upload Error: "+err);
btn.disabled=false;
});
}
</script>

</body>
</html>

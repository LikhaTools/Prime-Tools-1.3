<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warehouse Scanner - Modern UI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

body {
    font-family: 'Roboto', sans-serif;
    background: #eef2f7;
    margin: 0;
    padding: 10px;
}

.container {
    max-width: 500px;
    margin: auto;
}

.card {
    background: #fff;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    margin-bottom: 20px;
    transition: transform 0.3s;
}

.card:hover {
    transform: translateY(-3px);
}

h2, h3 {
    text-align: center;
    margin: 5px 0 15px;
}

.mode-select {
    display: flex;
    justify-content: space-around;
    margin-bottom: 12px;
}

.mode-select label {
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
}

textarea {
    width: 100%;
    min-height: 120px; /* ensures small size initially */
    max-height: 200px; /* prevents it from overflowing */
    padding: 12px;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid #ccc;
    resize: vertical; /* allow vertical resize if needed */
    transition: border-color 0.3s;
    box-sizing: border-box; /* include padding in width */
    margin-bottom: 12px; /* spacing below textarea */
}

#reader {
    margin-top: 12px;
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    min-height: 120px; /* ensures camera box has space */
}

textarea:focus {
    border-color: #28a745;
    outline: none;
}

#reader {
    margin-top: 10px;
    position: relative;
    border-radius: 12px;
    overflow: hidden;
}

/* Camera overlay rectangle guide */
#reader::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 220px;
    height: 80px;
    transform: translate(-50%, -50%);
    border: 3px dashed #28a745;
    border-radius: 10px;
    pointer-events: none;
}

/* Status */
.status {
    text-align: center;
    font-weight: bold;
    margin-top: 10px;
    font-size: 14px;
}
.success { color: #28a745; }
.error { color: #dc3545; }

/* Scan cards */
.scan-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
}
.scan-item {
    background: #e0f7fa;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    text-align: center;
    word-break: break-word;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    opacity: 0;
    transform: translateY(10px);
    animation: fadeIn 0.4s forwards;
}

/* Animation */
@keyframes fadeIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Upload button + spinner */
button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
    position: relative;
}
button:hover:not(.loading) {
    transform: translateY(-2px);
}
button.loading {
    pointer-events: none;
    opacity: 0.7;
}
button.loading::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 18px;
    height: 18px;
    border: 3px solid #fff;
    border-top: 3px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    transform: translate(-50%, -50%);
}
@keyframes spin {
    to { transform: rotate(360deg) translate(-50%, -50%); }
}

.btn-in { background: linear-gradient(90deg,#28a745,#2ecc71);}
.btn-out { background: linear-gradient(90deg,#dc3545,#e74c3c); }

/* Box Status table */
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}
th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
th { background: #f1f1f1; }
tbody tr:nth-child(even) { background: #f9f9f9; }

</style>
</head>
<body>
<div class="container">

<div class="card">
<h2>📦 Warehouse Scanner</h2>

<div class="mode-select">
<label><input type="radio" name="mode" value="IN" checked> Stock IN</label>
<label><input type="radio" name="mode" value="OUT"> Stock OUT</label>
</div>

<textarea id="barcodeList" placeholder="Scan multiple barcodes..."></textarea>

<div id="reader"></div>
<div id="status" class="status"></div>

<div class="scan-list" id="scanPreview"></div>

<button class="btn-in" id="uploadBtn" onclick="uploadBatch()">Upload Scans</button>
</div>

<div class="card">
<h3>📋 Box Status (Today)</h3>
<table id="boxTable">
<thead>
<tr>
<th>Item Name</th>
<th>Timestamp</th>
<th>Barcode</th>
<th>Status</th>
<th>Staff</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

</div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script>
const WEB_APP_URL="https://script.google.com/macros/s/AKfycby5Czt0r6qEPkv0bZCWxXCqnU67jhHeiFKSJjqdrugq2FNUm-yjETcY7CXVTwDa8VhEdA/exec";
const BEEP_URL="https://www.soundjay.com/buttons/sounds/button-3.mp3";

function isValid(code){ return /^[A-Z]{3}-\d{4}-\d{4}-\d{4}$/.test(code); }

function getStaff(){
    let today=new Date().toDateString();
    let saved=localStorage.getItem("staffData");
    if(saved){
        let obj=JSON.parse(saved);
        if(obj.date===today) return obj.name;
    }
    let name=prompt("Enter your full name:");
    if(!name) return null;
    localStorage.setItem("staffData",JSON.stringify({name:name,date:today}));
    return name;
}

function setStatus(msg,type){
    let el=document.getElementById("status");
    el.innerText=msg;
    el.className="status "+type;
}

function updatePreview(){
    const raw=document.getElementById("barcodeList").value.trim();
    const container=document.getElementById("scanPreview");
    container.innerHTML="";
    if(!raw) return;
    raw.split("\n").forEach(code=>{
        if(!code) return;
        const div=document.createElement("div");
        div.className="scan-item";
        div.innerText=code;
        container.appendChild(div);
    });
}

async function uploadBatch(){
    const btn = document.getElementById("uploadBtn");
    btn.classList.add("loading");
    btn.disabled = true;

    const raw=document.getElementById("barcodeList").value.trim();
    if(!raw){ 
        setStatus("No barcode scanned","error"); 
        btn.classList.remove("loading");
        btn.disabled = false;
        return; 
    }

    const lines=raw.split("\n").filter(x=>x);
    for(let code of lines){
        if(!isValid(code)){
            setStatus("Invalid format: "+code,"error");
            btn.classList.remove("loading");
            btn.disabled = false;
            return;
        }
    }

    const staff=getStaff();
    if(!staff){
        btn.classList.remove("loading");
        btn.disabled = false;
        return;
    }

    const mode=document.querySelector('input[name="mode"]:checked').value;
    if(!confirm(`Confirm ${lines.length} barcodes as ${mode==="IN"?"STOCK IN":"STOCK OUT"}?`)){
        btn.classList.remove("loading");
        btn.disabled = false;
        return;
    }

    for(let code of lines){
        try{
            let res=await fetch(WEB_APP_URL,{
                method:"POST",
                body:JSON.stringify({barcode:code.trim(),action:mode,staff:staff})
            });
            let json=await res.json();
            if(!json.success) console.log("Upload failed for "+code);
        }catch(e){console.log("Upload error:",code);}
    }

    new Audio(BEEP_URL).play();
    setStatus(lines.length+" barcodes uploaded","success");
    document.getElementById("barcodeList").value="";
    updatePreview();
    fetchBoxStatus();

    btn.classList.remove("loading");
    btn.disabled = false;
}

function onScanSuccess(text){
    let textarea=document.getElementById("barcodeList");
    let val=textarea.value.trim();
    textarea.value=val? val+"\n"+text : text;
    updatePreview();
    new Audio(BEEP_URL).play();
}

const scanner=new Html5QrcodeScanner("reader",{fps:10, qrbox:250});
scanner.render(onScanSuccess);

document.getElementById("barcodeList").addEventListener("input",updatePreview);

function fetchBoxStatus(){
    fetch(WEB_APP_URL)
    .then(res=>res.json())
    .then(data=>{
        const tbody=document.querySelector("#boxTable tbody");
        tbody.innerHTML="";
        data.slice(1).forEach(row=>{
            if(!row[2]) return;
            const tr=document.createElement("tr");
            tr.innerHTML=`<td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td><td>${row[4]}</td>`;
            tbody.appendChild(tr);
        });
    });
}

fetchBoxStatus();
</script>
</body>
</html>

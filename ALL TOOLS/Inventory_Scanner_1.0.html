<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Inventory Pro v2</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        /* Improved nav highlighting with transition */
        .nav-btn.active { color: #2563eb; border-top: 3px solid #2563eb; transition: all 0.2s ease; }
        .barcode-card { 
            width: 180mm; height: 100mm; padding: 10mm; 
            border: 1px solid #000; text-align: center; 
            display: flex; flex-direction: column; justify-content: space-between; 
            page-break-after: always; margin-bottom: 20px;
        }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

<div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-xl pb-24 relative">
    <div id="login-overlay" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-2xl w-full max-w-sm">
            <h1 class="text-2xl font-black text-center mb-6 uppercase tracking-tight">System Login</h1>
            <input type="text" id="user-name-input" placeholder="Enter Full Name" class="w-full border-2 p-3 rounded-xl mb-4 outline-none focus:border-blue-500">
            <div class="grid grid-cols-2 gap-3">
                <button onclick="auth('Warehouse')" class="bg-blue-600 text-white py-4 rounded-xl font-bold hover:bg-blue-700">WAREHOUSE</button>
                <button onclick="document.getElementById('mkt-auth').classList.toggle('hidden')" class="bg-purple-600 text-white py-4 rounded-xl font-bold hover:bg-purple-700">MARKETING</button>
            </div>
            <div id="mkt-auth" class="hidden mt-4 pt-4 border-t">
                <input type="password" id="mkt-pw" placeholder="Password: 1234" class="w-full border p-3 rounded-lg mb-2">
                <button onclick="auth('Marketing')" class="w-full bg-green-600 text-white py-2 rounded-lg font-bold">Verify & Enter</button>
            </div>
        </div>
    </div>

    <header class="bg-slate-800 text-white p-4 sticky top-0 z-40 flex justify-between items-center shadow-md">
        <div>
            <h2 id="display-name" class="font-bold leading-none">-</h2>
            <p id="display-role" class="text-[10px] uppercase tracking-widest text-slate-400 mt-1">-</p>
        </div>
        <div id="scan-status" class="text-xs px-2 py-1 rounded bg-slate-700 transition-colors duration-300">System Ready</div>
    </header>

    <main class="p-4">
        <section id="tab-dashboard" class="tab-content active">
            <h3 class="text-xs font-bold text-slate-400 mb-4 uppercase">Stock Overview</h3>
            <div id="summary-list" class="space-y-2">
                <p class="text-center text-slate-300 py-10">Connecting to Firestore...</p>
            </div>
            <h3 class="text-xs font-bold text-slate-400 mt-8 mb-4 uppercase">Latest Actions</h3>
            <div id="recent-history" class="text-xs space-y-2 bg-slate-50 p-3 rounded-xl min-h-[100px]"></div>
        </section>

        <section id="tab-generate" class="tab-content">
            <div class="bg-blue-50 p-4 rounded-xl space-y-3">
                <input type="text" id="gen-item" placeholder="Item Name (e.g. Classic T-Shirt)" class="w-full p-3 border rounded-lg">
                <div class="flex gap-2">
                    <input type="text" id="gen-short" placeholder="Short Code (STC)" class="w-1/2 p-3 border rounded-lg uppercase">
                    <input type="number" id="gen-pcs" placeholder="Pcs/Box" class="w-1/2 p-3 border rounded-lg">
                </div>
                <input type="number" id="gen-qty" placeholder="Quantity of Boxes" class="w-full p-3 border rounded-lg">
                <button id="gen-btn" onclick="secureGenerate()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black shadow-lg active:scale-95 transition-transform">GENERATE & PRINT</button>
            </div>
            <div id="print-area" class="mt-4"></div>
        </section>

        <section id="tab-scan" class="tab-content">
            <div class="flex bg-slate-100 p-1 rounded-xl mb-4">
                <button onclick="setScanMode('IN')" id="btn-in" class="flex-1 py-3 rounded-lg font-bold bg-white shadow text-blue-600">STOCK IN</button>
                <button onclick="setScanMode('OUT')" id="btn-out" class="flex-1 py-3 rounded-lg font-bold text-slate-500">STOCK OUT</button>
            </div>
            <div id="main-reader" class="rounded-2xl overflow-hidden bg-black aspect-square shadow-inner"></div>
            <div class="mt-4 p-4 bg-slate-50 rounded-xl text-center">
                <p class="text-[10px] text-slate-400 uppercase">Last Scanned</p>
                <p id="last-code-display" class="font-mono font-bold text-lg">---</p>
            </div>
        </section>

        <section id="tab-audit" class="tab-content">
            <div class="grid grid-cols-2 gap-2 mb-4">
                <button onclick="setAuditType('morning')" id="btn-morn" class="py-3 rounded-xl font-bold bg-blue-600 text-white shadow-md">MORNING</button>
                <button onclick="setAuditType('evening')" id="btn-eve" class="py-3 rounded-xl font-bold bg-slate-200 text-slate-600">EVENING</button>
            </div>
            <div id="audit-reader" class="rounded-xl overflow-hidden bg-black aspect-video mb-4 shadow-inner"></div>
            <button onclick="calculateAudit()" class="w-full bg-black text-white py-3 rounded-xl font-bold mb-4 shadow-lg active:invert">REFRESH REPORT</button>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-[11px]">
                    <thead><tr class="border-b text-slate-400"><th class="pb-2">Item</th><th>Morn</th><th>Out</th><th>Exp</th><th>Eve</th><th>Res</th></tr></thead>
                    <tbody id="audit-tbody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-2 max-w-md mx-auto shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
        <button id="nav-dashboard" onclick="showTab('dashboard')" class="nav-btn active flex-1 flex flex-col items-center p-2"><span class="text-xl">📊</span><span class="text-[10px]">Home</span></button>
        <button id="nav-generate" onclick="showTab('generate')" class="nav-btn hidden flex-1 flex flex-col items-center p-2"><span class="text-xl">➕</span><span class="text-[10px]">Gen</span></button>
        <button id="nav-scan" onclick="showTab('scan')" class="nav-btn flex-1 flex flex-col items-center p-2"><span class="text-xl">📷</span><span class="text-[10px]">Scan</span></button>
        <button id="nav-audit" onclick="showTab('audit')" class="nav-btn flex-1 flex flex-col items-center p-2"><span class="text-xl">⚖️</span><span class="text-[10px]">Audit</span></button>
    </nav>
</div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // --- APP STATE ---
    let currentUser = "";
    let userRole = "";
    let scanMode = "IN";
    let auditType = "morning";
    let statusTimer = null; // Track status timeout
    let lastMainScan = { code: "", time: 0 };
    let lastAuditScan = { code: "", time: 0 };
    
    const mainScanner = new Html5Qrcode("main-reader");
    const auditScanner = new Html5Qrcode("audit-reader");

    // --- AUTH ---
    function auth(role) {
        const nameInput = document.getElementById('user-name-input');
        const name = nameInput.value.trim();
        if(!name) return alert("Please enter your name!");
        if(role === 'Marketing' && document.getElementById('mkt-pw').value !== '1234') return alert("Access Denied: Wrong Password");
        
        currentUser = name;
        userRole = role;
        document.getElementById('display-name').innerText = name;
        document.getElementById('display-role').innerText = role;
        document.getElementById('login-overlay').style.display = 'none';
        
        if(role === 'Marketing') document.getElementById('nav-generate').classList.remove('hidden');
        
        initRealtime();
    }

    // --- NAVIGATION (FIXED HIGHLIGHTING) ---
    async function showTab(tabId) {
        // Clear active states from ALL buttons and content
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
        
        // Add active states to selected items
        document.getElementById('tab-' + tabId).classList.add('active');
        document.getElementById('nav-' + tabId).classList.add('active');

        // Stop all camera instances properly before switching
        await stopAllScanners();
        
        if(tabId === 'scan') startScanner('main');
        if(tabId === 'audit') startScanner('audit');
    }

    async function stopAllScanners() {
        try {
            if(mainScanner.isScanning) await mainScanner.stop();
            if(auditScanner.isScanning) await auditScanner.stop();
        } catch (err) {
            console.warn("Scanner stop warning:", err);
        }
    }

    // --- GENERATION (FIXED PRINT RELIABILITY) ---
    async function secureGenerate() {
        const itemInput = document.getElementById('gen-item');
        const item = itemInput.value.trim();
        const short = document.getElementById('gen-short').value.trim().toUpperCase();
        const pcs = document.getElementById('gen-pcs').value;
        const qtyReq = parseInt(document.getElementById('gen-qty').value);

        if(!item || !qtyReq || isNaN(qtyReq)) return alert("Missing required fields!");
        
        const btn = document.getElementById('gen-btn');
        btn.disabled = true; 
        btn.innerText = "Processing Cloud Data...";

        try {
            const printArea = document.getElementById('print-area');
            printArea.innerHTML = "";
            let countGenerated = 0;

            // 1. Check for Reusable AVAILABLE codes first
            const availSnap = await db.collection("barcodes")
                .where("item", "==", item)
                .where("status", "==", "AVAILABLE")
                .limit(qtyReq).get();

            for(let docSnap of availSnap.docs) {
                await docSnap.ref.update({ status: 'ACTIVE', updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
                renderBC(item, docSnap.id);
                countGenerated++;
            }

            // 2. Generate New Codes if needed
            if(countGenerated < qtyReq) {
                const allSnap = await db.collection("barcodes").where("item", "==", item).get();
                let maxCount = 0;
                allSnap.forEach(d => {
                    const c = parseInt(d.data().count || 0);
                    if(c > maxCount) maxCount = c;
                });

                while(countGenerated < qtyReq) {
                    maxCount++;
                    const cStr = maxCount.toString().padStart(4, '0');
                    const code = `${short}-${new Date().getFullYear()}-${pcs}-${cStr}`;
                    
                    await db.collection("barcodes").doc(code).set({
                        code, item, short, pcs, count: cStr, status: 'ACTIVE', 
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    renderBC(item, code);
                    countGenerated++;
                }
            }
            
            // UI Delay: Wait for SVGs to render before opening print dialog
            setStatus("Preparing Print...", "bg-blue-600");
            setTimeout(() => {
                window.print();
                btn.disabled = false;
                btn.innerText = "GENERATE & PRINT";
                // Reset form
                itemInput.value = "";
                document.getElementById('gen-qty').value = "";
            }, 1000);

        } catch(e) { 
            console.error(e); 
            alert("Database Error. Check Console.");
            btn.disabled = false;
            btn.innerText = "GENERATE & PRINT";
        }
    }

    function renderBC(item, code) {
        const div = document.createElement('div');
        div.className = "barcode-card";
        div.innerHTML = `<h2 class="text-xl font-bold uppercase">${item}</h2><svg id="bc-${code}"></svg><p class="font-mono text-sm">${code}</p>`;
        document.getElementById('print-area').appendChild(div);
        JsBarcode("#bc-" + code, code, { height: 60, fontSize: 14, width: 2 });
    }

    // --- SCANNER LOGIC (FIXED CAMERA START) ---
    function setScanMode(m) {
        scanMode = m;
        document.getElementById('btn-in').className = m === 'IN' ? "flex-1 py-3 rounded-lg font-bold bg-white shadow text-blue-600" : "flex-1 py-3 rounded-lg font-bold text-slate-500";
        document.getElementById('btn-out').className = m === 'OUT' ? "flex-1 py-3 rounded-lg font-bold bg-white shadow text-red-600" : "flex-1 py-3 rounded-lg font-bold text-slate-500";
    }

    function setAuditType(t) {
        auditType = t;
        document.getElementById('btn-morn').className = t === 'morning' ? "py-3 rounded-xl font-bold bg-blue-600 text-white shadow" : "py-3 rounded-xl font-bold bg-slate-200 text-slate-600";
        document.getElementById('btn-eve').className = t === 'evening' ? "py-3 rounded-xl font-bold bg-purple-600 text-white shadow" : "py-3 rounded-xl font-bold bg-slate-200 text-slate-600";
    }

    function startScanner(target) {
        const config = { fps: 15, qrbox: { width: 250, height: 250 } };
        const targetScanner = (target === 'main') ? mainScanner : auditScanner;
        const scanFn = (target === 'main') ? onMainScan : onAuditScan;

        targetScanner.start({ facingMode: "environment" }, config, scanFn)
        .catch(err => {
            console.error("Camera Start Error:", err);
            setStatus("Camera Failed", "bg-red-600");
        });
    }

    async function onMainScan(code) {
        const now = Date.now();
        if(code === lastMainScan.code && (now - lastMainScan.time) < 3000) return; // 3s cool down
        lastMainScan = { code, time: now };

        setStatus("Processing...", "bg-blue-500 text-white");
        try {
            const ref = db.collection("barcodes").doc(code);
            const snap = await ref.get();

            if(!snap.exists) return setStatus("INVALID CODE", "bg-red-600 text-white");

            const newStatus = scanMode === 'IN' ? 'ACTIVE' : 'AVAILABLE';
            await ref.update({ status: newStatus, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
            
            await db.collection("transactions").add({
                barcode: code, item: snap.data().item, action: scanMode, 
                user: currentUser, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            document.getElementById('last-code-display').innerText = code;
            setStatus("SUCCESS: " + scanMode, scanMode === 'IN' ? "bg-green-600 text-white" : "bg-orange-600 text-white");
            if(navigator.vibrate) navigator.vibrate(100);
        } catch(e) {
            setStatus("SCAN ERROR", "bg-red-800 text-white");
        }
    }

    async function onAuditScan(code) {
        const now = Date.now();
        if(code === lastAuditScan.code && (now - lastAuditScan.time) < 3000) return;
        lastAuditScan = { code, time: now };

        try {
            const snap = await db.collection("barcodes").doc(code).get();
            if(!snap.exists) return setStatus("UNKNOWN CODE", "bg-red-600 text-white");

            const coll = auditType === 'morning' ? "audit_morning" : "audit_evening";
            const startOfDay = new Date(); startOfDay.setHours(0,0,0,0);

            // Duplicate Check
            const exists = await db.collection(coll).where("barcode", "==", code).where("timestamp", ">=", startOfDay).get();
            
            if(exists.empty) {
                await db.collection(coll).add({ barcode: code, item: snap.data().item, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                setStatus("AUDIT LOGGED", "bg-blue-600 text-white");
                if(navigator.vibrate) navigator.vibrate([50, 50, 50]);
            } else {
                setStatus("ALREADY LOGGED", "bg-yellow-600 text-white");
            }
        } catch(e) { setStatus("AUDIT ERROR", "bg-red-800 text-white"); }
    }

    // --- AUDIT CALCULATION ---
    async function calculateAudit() {
        setStatus("Calculating...", "bg-slate-500");
        const today = new Date(); today.setHours(0,0,0,0);
        
        const [morn, eve, outs] = await Promise.all([
            db.collection("audit_morning").where("timestamp", ">=", today).get(),
            db.collection("audit_evening").where("timestamp", ">=", today).get(),
            db.collection("transactions").where("action", "==", "OUT").where("timestamp", ">=", today).get()
        ]);

        const stats = {};
        const process = (snap, key) => snap.forEach(d => {
            const item = d.data().item;
            if(!stats[item]) stats[item] = { m:0, e:0, o:0 };
            stats[item][key]++;
        });

        process(morn, 'm'); process(eve, 'e'); process(outs, 'o');

        document.getElementById('audit-tbody').innerHTML = Object.entries(stats).map(([name, v]) => {
            const exp = v.m - v.o;
            const res = v.e === exp ? "TALLY" : (v.e < exp ? "MISS" : "OVER");
            const color = res === 'TALLY' ? 'text-green-600' : 'text-red-600';
            return `<tr class="border-b"><td class="py-2">${name}</td><td>${v.m}</td><td>${v.o}</td><td>${exp}</td><td>${v.e}</td><td class="font-bold ${color}">${res}</td></tr>`;
        }).join('');
        
        setStatus("Report Updated", "bg-green-600");
    }

    // --- UI UTILS (FIXED STATUS RESETS) ---
    function setStatus(txt, cls) {
        const el = document.getElementById('scan-status');
        if(statusTimer) clearTimeout(statusTimer); // Clear existing timeout
        
        el.innerText = txt; 
        el.className = `text-xs px-2 py-1 rounded transition-all duration-200 ${cls}`;
        
        statusTimer = setTimeout(() => { 
            el.innerText = "System Ready"; 
            el.className = "text-xs px-2 py-1 rounded bg-slate-700 text-white"; 
        }, 3000);
    }

    function initRealtime() {
        // Realtime Dashboard
        db.collection("barcodes").onSnapshot(snap => {
            const sum = {};
            snap.forEach(d => {
                const b = d.data();
                if(!sum[b.item]) sum[b.item] = { active: 0, avail: 0 };
                b.status === 'ACTIVE' ? sum[b.item].active++ : sum[b.item].avail++;
            });
            
            const html = Object.entries(sum).map(([item, q]) => `
                <div class="flex justify-between items-center p-3 bg-white border rounded-xl shadow-sm">
                    <span class="font-bold text-sm">${item}</span>
                    <div class="text-[10px] space-x-1">
                        <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded">WH: ${q.active}</span>
                        <span class="bg-slate-100 text-slate-600 px-2 py-1 rounded">REUSE: ${q.avail}</span>
                    </div>
                </div>
            `).join('');
            document.getElementById('summary-list').innerHTML = html || '<p class="text-center text-slate-400 py-10">No stock found.</p>';
        });

        // Realtime History
        const today = new Date(); today.setHours(0,0,0,0);
        db.collection("transactions").where("timestamp", ">=", today).orderBy("timestamp", "desc").limit(5).onSnapshot(snap => {
            document.getElementById('recent-history').innerHTML = snap.docs.map(d => {
                const t = d.data();
                return `<div class="flex justify-between items-center border-b border-slate-100 pb-1">
                    <span class="text-slate-500">${t.barcode.split('-').pop()}...</span>
                    <span>${t.item.substring(0,12)}</span>
                    <b class="${t.action === 'IN' ? 'text-blue-600' : 'text-red-600'}">${t.action}</b>
                </div>`;
            }).join('');
        });
    }
</script>
</body>
</html>
